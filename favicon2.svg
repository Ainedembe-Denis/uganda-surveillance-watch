<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 150" width="100%" height="100%">
    <!-- Transparent Background -->
    <rect width="100%" height="100%" fill="none"/>

    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
            
            .fav-ug {
                font-family: 'Space Grotesk', -apple-system, sans-serif;
                font-size: 85px;
                font-weight: 700;
                fill: #1e3a8a; /* Deep Blue */
            }
            
            .fav-watch {
                font-family: 'Space Grotesk', -apple-system, sans-serif;
                font-size: 80px;
                font-weight: 700;
                fill: #DC2626; /* Alert Red */
                letter-spacing: 2px;
            }
            
            .fav-accent {
                fill: #DC2626;
            }
            
            .fav-bracket {
                fill: none;
                stroke: #DC2626;
                stroke-width: 10;
                stroke-linejoin: miter;
            }
        </style>
    </defs>

    <!-- Single Line Layout -->
    <g transform="translate(25, 105)">
        
        <!-- UG Text -->
        <text x="0" y="0" class="fav-ug">UG</text>
        
        <!-- [ ◤ WATCH ◢ ] Group -->
        <g transform="translate(160, -25)">
            <!-- Left Bracket [ -->
            <path d="M 25,-50 L 0,-50 L 0,35 L 25,35" class="fav-bracket" />
            
            <!-- Left Triangle ◤ -->
            <polygon points="12,-32 32,-32 12,-12" class="fav-accent" />
            
            <!-- WATCH Text -->
            <text x="45" y="20" class="fav-watch">WATCH</text>
            
            <!-- Right Triangle ◢ -->
            <polygon points="363,12 343,12 363,-8" class="fav-accent" />
            
            <!-- Right Bracket ] -->
            <path d="M 350,-50 L 375,-50 L 375,35 L 350,35" class="fav-bracket" />
        </g>
    </g>
</svg>
